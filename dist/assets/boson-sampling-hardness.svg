<svg xmlns="http://www.w3.org/2000/svg" width="800" height="770" viewBox="0 0 800 770" role="img" aria-labelledby="title description">
<title id="title">Ordinary boson sampling: the conditional hardness argument</title><desc id="description">The assumed classical sampler and a side box containing the proved Gaussian hiding and approximate counting reduction both point to additive squared-permanent estimates. The reduction uses an NP oracle. Anticoncentration and the AA conversion give relative permanent estimates. Average-case hardness then implies a collapse of the polynomial hierarchy.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#51667c"/></marker></defs>
<rect width="800" height="770" fill="#ffffff"/>
<path d="M244,150 V188" fill="none" stroke="#51667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M632.5,150 V235 H470" fill="none" stroke="#51667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M244,276 V310" fill="none" stroke="#51667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M244,410 V444" fill="none" stroke="#51667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M244,540 V594" fill="none" stroke="#51667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M490,364 H470" fill="none" stroke="#51667c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M490,654 H470" fill="none" stroke="#51667c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="24" width="440" height="126" rx="10" fill="#fff5df" stroke="#a87a2c" stroke-width="2"/>
<text x="244.0" y="81.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">Hypothetical efficient classical</text>
<text x="244.0" y="106.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">approximate boson sampler</text>
<rect x="490" y="24" width="285" height="126" rx="10" fill="#eff5fc" stroke="#6285ad" stroke-width="2"/>
<text x="632.5" y="56.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">Proved reduction [1,15]</text>
<text x="632.5" y="81.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">Gaussian hiding</text>
<text x="632.5" y="106.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">+ approximate counting</text>
<text x="632.5" y="131.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">Using an NP oracle</text>
<rect x="24" y="194" width="440" height="82" rx="10" fill="#eff5fc" stroke="#6285ad" stroke-width="2"/>
<text x="244.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">Additive estimate of |Per(X)|²</text>
<text x="244.0" y="242.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">Error ≤ ε N!</text>
<text x="244.0" y="267.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">For most Gaussian matrices X</text>
<rect x="24" y="316" width="440" height="94" rx="10" fill="#eff5fc" stroke="#6285ad" stroke-width="2"/>
<text x="244.0" y="357.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">AA conversion [1, Theorem 1.7]</text>
<text x="244.0" y="382.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">Includes the complex-phase reduction</text>
<rect x="24" y="450" width="440" height="90" rx="10" fill="#eff5fc" stroke="#6285ad" stroke-width="2"/>
<text x="244.0" y="489.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">Relative estimation of Per(X)</text>
<text x="244.0" y="514.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">using an NP oracle</text>
<rect x="24" y="600" width="440" height="120" rx="10" fill="#eff5fc" stroke="#6285ad" stroke-width="2"/>
<text x="244.0" y="642.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">Polynomial hierarchy collapses</text>
<text x="244.0" y="667.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">to its third level</text>
<text x="244.0" y="692.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">Contradicts the noncollapse assumption</text>
<rect x="490" y="307" width="285" height="114" rx="10" fill="#e5f4fb" stroke="#2174a5" stroke-width="2"/>
<text x="632.5" y="346.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">Permanent anticoncentration</text>
<text x="632.5" y="371.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">Koehler–Leung [2]</text>
<text x="632.5" y="396.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">2026 preprint result</text>
<rect x="490" y="585" width="285" height="135" rx="10" fill="#fff5df" stroke="#a87a2c" stroke-width="2"/>
<text x="632.5" y="622.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172d47" text-anchor="middle">Gaussian permanent</text>
<text x="632.5" y="647.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">average-case #P-hardness</text>
<text x="632.5" y="672.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">AA Conjecture 1.5</text>
<text x="632.5" y="697.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172d47" text-anchor="middle">Separate assumption</text>
<text x="24" y="742" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#51667c">The reductions require the stated accuracy, hiding regime, and finite-precision model.</text>
</svg>